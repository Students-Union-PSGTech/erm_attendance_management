services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erm-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: ${PORT:-4000}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "8h"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000,https://erm-attendance-management-six.vercel.app,https://erm-attendance-management-iglt.vercel.app}
